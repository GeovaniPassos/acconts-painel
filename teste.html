<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Drag and Drop Simples</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add_2" />
</head>
<body>

  <div class="body-expenses">
 
    <div class="expenses card ">
      <h2>Contas Não Pagas</h2>
    </div>

    <div class="container">
      <div class="card">

        <div class="name-card">
          <input type="text"  id="input-name-card" placeholder="Descrição">

          <span id="card-title" title="Clique para editar"></span>
          
          <span class="space"></span>

          <button class="delete-card"> ❌</button>
          
        </div>
        

        <div class="item" draggable="true">Item 1</div>
        <div class="item" draggable="true">Item 2</div>
        <div class="item" draggable="true">Item 3</div>
      </div>
      
      <div class="card-button">
        <button class="btn-adicionar">
          <span class="material-symbols-outlined">
            add_2 </span> Adicionar bloco
        </button>
      </div>
      
    </div>
    <div class="card expenses paid">
      <h2>Contas Pagas</h2>
    </div>
  </div>  

  <script src="script.js"></script>
</body>
</html>
